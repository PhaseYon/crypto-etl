# Root stack: shared infrastructure (Kafka) plus one compose file per component.
# Each component owns its own file so they can evolve independently.
include:
  - producer/compose.yml
  - lake/compose.yml
  - ml/compose.yml

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      # Single node acting as both broker and controller (KRaft mode, no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: for other containers (producer, Spark) -> kafka:29092
      # EXTERNAL: for apps on your machine -> localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single-node settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      # Store logs on the named volume (the image default is /tmp, which is lost on recreate)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Use the INTERNAL listener: EXTERNAL advertises localhost:${KAFKA_HOST_PORT}, which only
      # works inside the container when the host port happens to be 9092
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # One-shot job: creates topics once Kafka is healthy, then exits
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --create --if-not-exists --topic raw.trades --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic raw.trades

volumes:
  kafka-data:
