[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-producer"
version = "0.1.0"
description = "Streams Coinbase trades into Kafka, with gap backfill"
requires-python = ">=3.12"
dependencies = ["confluent-kafka==2.15.1", "websockets==17.1"]

[tool.setuptools]
packages = ["crypto_producer"]
